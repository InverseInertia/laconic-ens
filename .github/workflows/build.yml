name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pip install -e '.[dev]'
      - run: pytest -q

  binary:
    needs: test
    # Not on pushes to main: the PR already built and tested this code, and the binaries would
    # say "dev", so nothing uses them. Tags build the release; Run workflow builds any branch.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both build a folder, dist/lens. Windows makes the installer from it (packaging/lens.iss);
          # Linux packs it as the archive install-linux.sh installs.
          - { os: windows-latest, name: lens-windows-x64, exe: dist/lens/lens.exe, out: dist/lens-install-wizard.exe }
          # Oldest available runner so the binary works on more distros (glibc).
          - { os: ubuntu-22.04, name: lens-linux-x64, exe: dist/lens/lens, out: dist/lens-linux-x64.tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Stamp the version (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # laconic/_version.py is the one place the version is written; a release takes it from
          # the tag (v0.2.0 -> 0.2.0), the same version the release job puts in the file names.
          sed -i "s/^__version__ = .*/__version__ = \"${GITHUB_REF_NAME#v}\"/" laconic/_version.py
          grep -q "^__version__ = \"${GITHUB_REF_NAME#v}\"" laconic/_version.py
      - run: pip install . pyinstaller pillow
      - run: pyinstaller packaging/lens.spec
      - name: Smoke test (serves the page and the self-hosted assets)
        shell: bash
        run: python packaging/smoke.py ${{ matrix.exe }} "$(python -c 'from laconic._version import label; print(label())')"
      - name: Pack, install, smoke test and uninstall (Linux)
        if: runner.os == 'Linux'
        run: |
          # tar keeps the executable bits, which upload-artifact would drop.
          tar -czf dist/lens-linux-x64.tar.gz -C dist lens
          # Install it as a build of your own: the archive and icons, unversioned, beside the script.
          kit="$RUNNER_TEMP/kit"; mkdir "$kit"
          cp packaging/install-linux.sh dist/lens-linux-x64.tar.gz "$kit"
          cp packaging/icon.png "$kit/lens-icon.png"; cp packaging/file-icon.png "$kit/lens-file-icon.png"
          export HOME="$RUNNER_TEMP/home"; mkdir "$HOME"
          sh "$kit/install-linux.sh"
          app="$HOME/.local/share/laconic-lens"
          python packaging/smoke.py "$app/lens" "$(python -c 'from laconic._version import label; print(label())')"
          ls "$app"/examples/*.lens > /dev/null
          grep -q "MIT License" "$app/LICENSE.txt" && grep -q "^numpy " "$app/THIRD-PARTY-NOTICES.txt"
          grep -qx "Exec=\"$app/lens\" --window %f" "$HOME/.local/share/applications/laconic-lens.desktop"
          sh "$kit/install-linux.sh" --uninstall
          test ! -e "$app" && test ! -e "$HOME/.local/share/applications/laconic-lens.desktop"
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade innosetup --no-progress -y   # installs it, or updates it to a version that reads lens.iss
          $version = python -c "from laconic._version import __version__; print(__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" packaging\lens.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install, smoke test and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Start-Process dist\lens-install-wizard.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=assoc' -Wait -PassThru
          if ($setup.ExitCode) { throw "installer exited with $($setup.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\LENS"
          python packaging/smoke.py "$app\lens.exe" (python -c "from laconic._version import label; print(label())")
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-ItemProperty 'HKCU:\Software\Classes\.lens').'(default)' -ne 'LaconicLens.Worksheet') { throw ".lens files are not set to open in LENS" }
          if ((Get-ItemProperty 'HKCU:\Software\Classes\LaconicLens.Worksheet\shell\open\command').'(default)' -ne "`"$app\lens.exe`" --window `"%1`"") { throw "wrong open command for .lens files" }
          if (-not (Test-Path "$app\examples\*.lens")) { throw "no example worksheets installed" }
          if (-not (Select-String -Quiet "MIT License" "$app\LICENSE.txt")) { throw "LICENSE.txt not installed" }
          if (-not (Select-String -Quiet "^numpy " "$app\THIRD-PARTY-NOTICES.txt")) { throw "THIRD-PARTY-NOTICES.txt not installed" }
          Wait-Process -Name lens -Timeout 30 -ErrorAction SilentlyContinue   # the solver worker, after the smoke test's server
          # The uninstaller restarts itself from a temporary folder, so wait for the files to go.
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\lens.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\lens.exe") { throw "uninstall left lens.exe behind" }
          if (Test-Path 'HKCU:\Software\Classes\LaconicLens.Worksheet') { throw "uninstall left the .lens file type behind" }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.out }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binary
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Collect release files
        run: |
          # The version from the tag (v0.2.0 -> 0.2.0) goes in every file name, so downloads of
          # different releases do not overwrite each other.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir release
          mv artifacts/lens-windows-x64/lens-install-wizard.exe "release/lens-$VERSION-windows-x64-install-wizard.exe"
          mv artifacts/lens-linux-x64/lens-linux-x64.tar.gz "release/lens-$VERSION-linux-x64.tar.gz"
      - uses: actions/checkout@v4
        with: { path: src, fetch-depth: 0 }  # all tags, for the compare link to the previous one
      - name: Release notes from CHANGELOG.md
        # The tag's section of the changelog, or Unreleased when it has none yet.
        run: cd src && python3 packaging/release_notes.py "$GITHUB_REF_NAME" > ../notes.md && cat ../notes.md
      - name: Add the Linux installer and its icons
        run: |
          # The installer looks up the latest release when it runs, so it is not stamped and its
          # name carries no LENS version, only its own major version (INSTALLER_VERSION in the
          # script): .../releases/latest/download/lens-install-linux-v2.sh always gives the newest one.
          grep -Eq '^INSTALLER_VERSION="[0-9]+\.[0-9]+\.[0-9]+"$' src/packaging/install-linux.sh
          cp src/packaging/install-linux.sh release/lens-install-linux-v2.sh
          cp src/packaging/icon.png "release/lens-$VERSION-icon.png"
          cp src/packaging/file-icon.png "release/lens-$VERSION-file-icon.png"
          # Installer 1.x downloads lens-<version>-linux-x64; this stand-in runs installer 2 for it.
          sed "s/^VERSION=\"@VERSION@\"$/VERSION=\"$VERSION\"/" src/packaging/v1-bridge.sh > "release/lens-$VERSION-linux-x64"
          grep -qx "VERSION=\"$VERSION\"" "release/lens-$VERSION-linux-x64"
          chmod +x release/lens-install-linux-v2.sh "release/lens-$VERSION-linux-x64"
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: notes.md

  changelog:
    # After a release, CHANGELOG.md on main gets the tag's heading in place of ## Unreleased, with
    # a new, empty ## Unreleased above it. Entries merged since the tag stay under Unreleased.
    # A push made with GITHUB_TOKEN starts no workflows, so this does not build main again.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions: { contents: write }
    concurrency: { group: changelog-main, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - name: Stamp the tag's section and push to main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_REF_NAME" origin/main; then
            echo "::notice::$GITHUB_REF_NAME is not on main; CHANGELOG.md is left as it is."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            python3 packaging/stamp_changelog.py "$GITHUB_REF_NAME" "$(date -u +%F)"
            git diff --quiet CHANGELOG.md && { echo "CHANGELOG.md already has $GITHUB_REF_NAME"; exit 0; }
            git commit -qam "CHANGELOG: $GITHUB_REF_NAME released"
            git push origin HEAD:main && exit 0
            # main moved while this ran: start again from the new main
            git fetch -q origin main && git reset -q --hard origin/main
          done
          exit 1
