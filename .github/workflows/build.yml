name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pip install -e '.[dev]'
      - run: pytest -q

  binary:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: lens-windows-x64 }
          # Oldest available runner so the binary works on more distros (glibc).
          - { os: ubuntu-22.04, name: lens-linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Stamp the version (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # laconic/_version.py is the one place the version is written; a release takes it from
          # the tag (v0.2.0 -> 0.2.0), the same version the release job puts in the file names.
          sed -i "s/^__version__ = .*/__version__ = \"${GITHUB_REF_NAME#v}\"/" laconic/_version.py
          grep -q "^__version__ = \"${GITHUB_REF_NAME#v}\"" laconic/_version.py
      - run: pip install . pyinstaller pillow
      - run: pyinstaller packaging/lens.spec
      - name: Smoke test (serves the page and the self-hosted assets)
        shell: bash
        run: python packaging/smoke.py dist/lens* "$(python -c 'from laconic._version import label; print(label())')"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/lens*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binary
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Collect release files
        run: |
          # The version from the tag (v0.2.0 -> 0.2.0) goes in every file name, so downloads of
          # different releases do not overwrite each other.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir release
          mv artifacts/lens-windows-x64/lens.exe "release/lens-$VERSION-windows-x64.exe"
          mv artifacts/lens-linux-x64/lens "release/lens-$VERSION-linux-x64"
          chmod +x "release/lens-$VERSION-linux-x64"  # upload-artifact drops the executable bit
      - uses: actions/checkout@v4
        with: { path: src, fetch-depth: 0 }  # all tags, for the compare link to the previous one
      - name: Release notes from CHANGELOG.md
        # The tag's section of the changelog, or Unreleased when it has none yet.
        run: cd src && python3 packaging/release_notes.py "$GITHUB_REF_NAME" > ../notes.md && cat ../notes.md
      - name: Add the Linux installer and its icons
        run: |
          # The installer looks up the latest release when it runs, so it is not stamped and its
          # name carries no version: .../releases/latest/download/lens-install-linux.sh always
          # gives the newest one. Its own version is the INSTALLER_VERSION line in the script.
          grep -Eq '^INSTALLER_VERSION="[0-9]+\.[0-9]+\.[0-9]+"$' src/packaging/install-linux.sh
          cp src/packaging/install-linux.sh release/lens-install-linux.sh
          cp src/packaging/icon.png "release/lens-$VERSION-icon.png"
          cp src/packaging/file-icon.png "release/lens-$VERSION-file-icon.png"
          chmod +x release/lens-install-linux.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: notes.md

  changelog:
    # After a release, CHANGELOG.md on main gets the tag's heading in place of ## Unreleased, with
    # a new, empty ## Unreleased above it. Entries merged since the tag stay under Unreleased.
    # A push made with GITHUB_TOKEN starts no workflows, so this does not build main again.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions: { contents: write }
    concurrency: { group: changelog-main, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - name: Stamp the tag's section and push to main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_REF_NAME" origin/main; then
            echo "::notice::$GITHUB_REF_NAME is not on main; CHANGELOG.md is left as it is."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            python3 packaging/stamp_changelog.py "$GITHUB_REF_NAME" "$(date -u +%F)"
            git diff --quiet CHANGELOG.md && { echo "CHANGELOG.md already has $GITHUB_REF_NAME"; exit 0; }
            git commit -qam "CHANGELOG: $GITHUB_REF_NAME released"
            git push origin HEAD:main && exit 0
            # main moved while this ran: start again from the new main
            git fetch -q origin main && git reset -q --hard origin/main
          done
          exit 1
