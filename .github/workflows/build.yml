name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pip install -e '.[dev,coolprop]'
      - run: pytest -q

  binary:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: lens-windows-x64, full: "0" }
          - { os: windows-latest, name: lens-full-windows-x64, full: "1" }
          # Oldest available runner so the binary works on more distros (glibc).
          - { os: ubuntu-22.04, name: lens-linux-x64, full: "0" }
          - { os: ubuntu-22.04, name: lens-full-linux-x64, full: "1" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install . pyinstaller
      - if: matrix.full == '1'
        run: pip install CoolProp
      - run: pyinstaller packaging/lens.spec
        env: { LENS_FULL: "${{ matrix.full }}" }
      - name: Smoke test (serves the page and the self-hosted assets)
        shell: bash
        run: python packaging/smoke.py dist/lens*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/lens*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binary
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Collect release files
        run: |
          mkdir release
          mv artifacts/lens-windows-x64/lens.exe release/lens-windows-x64.exe
          mv artifacts/lens-full-windows-x64/lens-full.exe release/lens-full-windows-x64.exe
          mv artifacts/lens-linux-x64/lens release/lens-linux-x64
          mv artifacts/lens-full-linux-x64/lens-full release/lens-full-linux-x64
          chmod +x release/lens-linux-x64 release/lens-full-linux-x64  # upload-artifact drops the executable bit
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
